<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salary</title>
    <style>
    *{
        margin: 0;
        padding: 0;
    }
    body{
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: #ffffff;
        text-align: center;
    }
    h1{
        padding: 30px;
    }
    div {
        width: 350px;
        background-color: navy;
        text-align: center;
        margin: 80px auto;
        color: rgb(180, 180, 255);
        padding: 20px;
        border-radius: 8px;
    }
    button{
    margin-top: 5px;
    background: #00f2fe;
    color: #0f172a;
    text-decoration: none;
    font-weight: 700;
    font-size: 13px;
    text-transform: uppercase;
    padding: 10px 10px;
    letter-spacing: 0.5px;
    transform: all 0.3 ease;
    }
    button:hover{
    background: #ffffff;
    box-shadow: 0 0 15px rgb(0, 242, 254, 0.6);
    }
    input{
        background-color: whitesmoke;
        width: 280px;
        height: 25px;
        margin: 5px;
    }
    .btn{
        background: #00f2fe;
        color: #0f172a;
        text-decoration: none;
        font-weight: 700;
        font-size: 13px;
        text-transform: uppercase;
        padding: 10px 10px;
        letter-spacing: 0.5px;
        transform: all 0.3 ease;
    }
    .btn:hover{
    background: #ffffff;
    box-shadow: 0 0 15px rgb(0, 242, 254, 0.6);
    }
    </style>
</head>
<body>
    <a class="btn" href="index.html">BACK</a>
    <div>
        <h1>STAFF CAMBODIA TAXATION</h1>
        <input type="text" id="name" placeholder="Enter your name."><br>
        <input type="number" id="salary" placeholder="Enter your salary."><br>
        <button onclick="tax()">Click</button>
        <h2 id="a"></h2>
        <h2 id="b"></h2>
        <h2 id="tax"></h2>
        <h2 id="netsalary"></h2>
        
        <script>
            function tax(){
                let name = document.getElementById("name").value;
                document.getElementById("a").innerHTML="name" + name;
                let salary =parseFloat (document.getElementById("salary").value);
                document.getElementById("b").innerHTML="salary"+salary+"R";
                let tax = 0;
                if (salary<=1500000) tax = 0;
                else if (salary<=2000000) tax = (salary*0.05)-75000;
                else if (salary<=8500000) tax = (salary*0.10)-175000;
                else if (salary<=12500000) tax = (salary*0.15)-600000;
                else tax = (salary*0.2)-1225000;
                netsalary = salary-tax;
                document.getElementById("tax").innerHTML="Tax: "+tax+"R";
                document.getElementById("netsalary").innerHTML="Netsalary: "+netsalary+"R";
            }
        </script>
    </div>
</body>
</html>
