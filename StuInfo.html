<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information</title>
    <style>
        div{
            width: 350px;
            background-color: rgb(192, 184, 98);
            text-align: center;
            margin: 80px auto;
            color: rgb(38, 32, 101);
        }
        button {
            padding: 8px;
            border: skyblue;
            border-radius: 5px;
            background: skyblue;
            font-weight: bold;
            margin: 10px;
            margin-top: 20px;
            cursor: pointer;
        }
        button:hover{
            background: rgb(231, 188, 80);
            transition: transform 0.3s ease;
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <div>
    <h1>Student Information</h1>
    <input type="text" id="iname" placeholder="Name"><p></p>
    <input type="text" id="sub" placeholder="Subject"><p></p>
    <input type="number" id="iscore" placeholder="Score"><p></p>

    <h2 id="name"></h2>
    <h2 id="Subject"></h2>
    <h2 id ="Score"></h2>
    <button onclick= "C()">Done </button>
    </div>
    <script>
        function C(){
            fname=document.getElementById("iname").value;
            subject=document.getElementById("sub").value;
            score=parseFloat(document.getElementById("iscore").value);
            if (score >= 60) result = "Pass";
            else result = "Fail";
            if(score>95)grade="A+";
            else if(score>93)grade="A-";
            else if(score>90)grade="A-";
            else if(score>87)grade="B+";
            else if(score>81)grade="B-";
            else if(score>78)grade="C+";
            else if(score>75)grade="C-";
            else if(score>72)grade="E+";
            else if(score>69)grade="E-";
            else grade="F";
            document.getElementById("name").innerHTML="Name:"+fname;
            document.getElementById("Subject").innerHTML="Subject:"+subject;
            document.getElementById("Score").innerHTML = "Score: " + score + " - " + grade;
        }
    </script>
</body>
</html>
