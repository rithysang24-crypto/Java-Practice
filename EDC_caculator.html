<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDC System</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            font-family: Arial, sans-serif;
            background: #c9c9c9;
            color: #222;
            text-align: center;
        }
        div {
            width: 350px;
            background-color: rgb(79, 162, 101);
            text-align: center;
            margin: 80px auto;
            color: rgb(180, 180, 255);
            padding: 20px;
            border-radius: 8px;
        }
        input {
            padding: 10px;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        button {
            padding: 8px;
            border: skyblue;
            border-radius: 5px;
            background: skyblue;
            font-weight: bold;
            margin: 10px;
            margin-top: 20px;
            cursor: pointer;
        }
        button:hover{
            background: rgb(231, 188, 80);
            transition: transform 0.3s ease;
            transform: scale(1.1);
        }
        h2 {
            font-size: 18px;
            margin: 5px 0;
            color: aqua;
        }
    </style>
</head>
<body>
    <div>
        <h1>EDC Calculator</h1>
        <input type="text" id="CName" placeholder="Name"><br>
        <input type="text" id="CAdd" placeholder="Address"><br>
        <input type="number" id="oldKw" placeholder="OldKw"><br>
        <input type="number" id="newKw" placeholder="NewKw"><br>
        
        <h2 id="Info"></h2>
        <h2 id="displayName"></h2>
        <h2 id="displayAdd"></h2>
        <h2 id="usedKw"></h2>
        <h2 id="totalBill"></h2>
        
        <button onclick="edc()">Done</button>
    </div>

    <script>
        function edc(){
            let customer = document.getElementById("CName").value;
            let address = document.getElementById("CAdd").value;
            let OldKw = parseFloat(document.getElementById("oldKw").value) || 0;
            let NewKw = parseFloat(document.getElementById("newKw").value) || 0;
            let kwhUsed = NewKw - OldKw;
            let totalBill = 0;
            
            if (kwhUsed <= 0) {
                totalBill = 0;
            } else if (kwhUsed <= 10) {
                totalBill = kwhUsed * 380;
            } else if (kwhUsed <= 50) {
                totalBill = kwhUsed * 480;
            } else if (kwhUsed <= 200) {
                totalBill = kwhUsed * 610;
            } else {
                totalBill = kwhUsed * 730;
            }
            document.getElementById("Info").innerHTML = "EDC Management System";
            document.getElementById("displayName").innerHTML = "Customer Name: " + customer;
            document.getElementById("displayAdd").innerHTML = "Address: " + address;
            document.getElementById("usedKw").innerHTML = "Use KW: " + kwhUsed + " kWh";
            document.getElementById("totalBill").innerHTML = "Total Bill: " + totalBill.toLocaleString() + " Riel";
        }
    </script>
</body>
</html>
